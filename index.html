<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05080e">
  <meta name="description" content="Ali Akashi is a data analyst in Dubai, UAE, focused on Python, SQL, machine learning, NLP, dashboards, and digital products.">
  <link rel="icon" type="image/svg+xml" href="/favicon-aa.svg">
  <title>Ali Akashi — Data Analyst</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #05080e;
      --black-soft: #090e17;
      --panel: #0e1520;
      --panel-light: #121c29;
      --blue: #174577;
      --blue-strong: #225a94;
      --blue-light: #78b5f5;
      --white: #f5f7fa;
      --gray: #a5afbd;
      --gray-dark: #667383;
      --line: #202b39;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 86px; }
    body { margin: 0; background: var(--black); color: var(--white); font: 16px/1.7 "Segoe UI", Arial, sans-serif; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--blue-light); outline-offset: 4px; }
    img { max-width: 100%; }
    .container { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
    .topbar { position: fixed; z-index: 50; inset: 0 0 auto; border-bottom: 1px solid transparent; padding: 21px 0; transition: background .25s, border-color .25s, padding .25s; }
    .topbar.scrolled { background: rgba(5,8,14,.91); border-color: var(--line); padding: 13px 0; backdrop-filter: blur(14px); }
    .nav { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
    .brand { font-size: 23px; font-weight: 800; letter-spacing: -.08em; }
    .brand span { color: var(--blue-light); }
    .nav-center { display: contents; }
    .nav-links { display: flex; gap: 27px; align-items: center; }
    .nav-links a { color: #c2cbd6; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .11em; transition: color .2s; }
    .nav-links a:hover { color: var(--blue-light); }
    @media (min-width:1100px) { .nav-links { gap: 32px; } .nav { position: relative; justify-content: flex-start; gap: 10px; } .nav-links { position: absolute; left: 50%; transform: translateX(-50%); } .brand { position: absolute; left: calc(clamp(40px, 12vw, 180px) + 6px); top: 50%; transform: translateY(-50%); } html[dir="rtl"] .brand { left: auto; right: calc(clamp(40px, 12vw, 180px) + 6px); } .language-toggle { margin-left: auto; } }
    .nav-resume { border: 1px solid var(--blue-strong); border-radius: 999px; padding: 8px 15px; color: var(--white); font-size: 12px; font-weight: 700; transition: background .2s; }
    .nav-resume:hover { background: var(--blue); }
    .language-toggle { min-width: 68px; height: 35px; border: 1px solid #3b3e46; border-radius: 999px; padding: 0 12px; background: transparent; color: var(--white); font: 700 12px/1 "Segoe UI", Tahoma, Arial, sans-serif; cursor: pointer; transition: border-color .2s,background .2s; }
    .language-toggle:hover { border-color: var(--blue-light); background: #17457725; }
    .menu-toggle { display: none; border: 1px solid var(--line); color: var(--white); background: var(--panel); border-radius: 8px; padding: 8px 11px; font-size: 18px; }
    .hero { min-height: 760px; min-height: max(760px, 100svh); position: relative; overflow: hidden; display: flex; align-items: center; background: var(--black); }
    .hero::before { content: ""; position: absolute; top: -15%; right: -10%; width: 70%; height: 135%; background: linear-gradient(145deg, #111923, #0a111b 70%); transform: skewX(-12deg); }
    @media (min-width:701px) { .hero::before { width: 60%; } }
    .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--black) 0%, transparent 36%, transparent 82%, rgba(5,8,14,.4) 100%); pointer-events: none; }
    .hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1.12fr .88fr; align-items: center; gap: 72px; padding-top: 78px; }
    .hero-copy { max-width: 660px; }
    @media (min-width:701px) { .hero-copy { position: relative; left: clamp(40px, 12vw, 180px); top: -44px; } html[dir="rtl"] .hero-copy { left: auto; right: clamp(40px, 12vw, 180px); } .hero h1 { font-size: clamp(56px, 7.8vw, 96px); } .hero-copy .eyebrow { margin-left: 11px; } .hero-description { font-size: clamp(16px, 1.75vw, 19px); } }
    .hero-copy { animation: hero-copy-enter .8s ease-out both; }
    .portrait-wrap.portrait-reveal { animation: hero-portrait-enter .8s .2s ease-out both; }
    .hero-mobile-portrait.portrait-reveal { animation: hero-portrait-enter .65s ease-out both; }
    .scroll-cue { animation: hero-scroll-enter 1s 1s ease-out both; }
    @keyframes hero-copy-enter { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes hero-portrait-enter { from { opacity: 0; transform: translateX(50px) scale(.9); } to { opacity: 1; transform: translateX(0) scale(1); } }
    @keyframes hero-scroll-enter { from { opacity: 0; translate: 0 10px; } to { opacity: 1; translate: 0 0; } }
    .eyebrow, .section-kicker { color: var(--blue-light); font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .25em; }
    .hero h1 { font-size: clamp(64px, 9vw, 112px); line-height: .91; letter-spacing: -.085em; margin: 17px 0 25px; }
    .hero h1 span { color: #aeb8c5; }
    html[lang="ar"] .hero h1 { line-height: 1.18; letter-spacing: 0; }
    .hero-description { max-width: 590px; color: #b6c0cc; font-size: clamp(17px, 2vw, 21px); line-height: 1.65; }
    .hero-description strong { color: var(--white); font-weight: 650; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 29px 0 28px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 11px; padding: 13px 19px; border: 1px solid var(--blue-strong); border-radius: 13px; font-size: 14px; font-weight: 700; transition: transform .2s, background .2s, border-color .2s; }
    .button:hover { transform: translateY(-2px); }
    .button.primary { background: var(--blue-strong); color: white; box-shadow: 0 8px 28px #17457735; }
    .button.primary:hover { background: #2d6eac; }
    .button.outline { border-color: #435061; color: var(--white); }
    .button.outline:hover { border-color: var(--blue-light); background: #17457720; }
    .button.resume { min-width: 186px; border-color: #087f9d; border-radius: 17px; padding: 14px 22px; }
    .button.resume:hover { border-color: #08a6c6; background: #087f9d18; }
    .button.resume svg { width: 19px; height: 19px; }
    .hero-socials { display: flex; flex-wrap: wrap; gap: 12px; }
    .social-button { position: relative; display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid #292c32; border-radius: 9px; background: #111215; color: #a7adb7; transition: color .2s,border-color .2s,background .2s,transform .2s; }
    .social-button:hover { color: #f5f7fa; border-color: #454a53; background: #1a1c20; transform: translateY(-2px); }
    .social-button svg { width: 21px; height: 21px; display: block; }
    .social-button.whatsapp .social-icon { color: #20d45a; }
    .social-button.telegram .social-icon { color: #a7adb7; }
    .social-button[title]:hover::after { content: attr(title); position: absolute; z-index: 5; top: calc(100% + 9px); left: 50%; transform: translateX(-50%); padding: 5px 8px; border: 1px solid #303640; border-radius: 5px; background: #11151c; color: #eef3f9; font-size: 11px; white-space: nowrap; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .portrait-wrap { position: relative; width: min(100%, 440px); aspect-ratio: 4 / 5; margin: 0 auto; }
    .portrait-frame { position: absolute; inset: 0; border: 2px solid #225a946e; border-radius: 18px; transform: translate(13px, 13px); }
    .portrait-image { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: #151c25; box-shadow: 0 28px 80px #0008; }
    .portrait-image img { width: 100%; height: 100%; object-fit: cover; object-position: center 34%; }
    .hero-mobile-portrait { display: none; }
    .portrait-wrap[hidden], .hero-mobile-portrait[hidden] { display: none !important; }
    .scroll-cue { position: absolute; z-index: 2; bottom: 24px; left: 50%; width: 23px; height: 37px; border: 2px solid #526070; border-radius: 20px; transform: translateX(-50%); }
    .scroll-cue::after { content: ""; position: absolute; top: 6px; left: 8px; width: 3px; height: 7px; border-radius: 4px; background: var(--blue-light); animation: scroll 1.5s infinite; }
    @keyframes scroll { 0%{opacity:0;transform:translateY(0)} 40%{opacity:1} 100%{opacity:0;transform:translateY(13px)} }
    .section { position: relative; padding: 112px 0; overflow: hidden; scroll-margin-top: 70px; }
    .section.alt { background: #080d14; }
    .section-head { margin-bottom: 48px; }
    .section-head.center { text-align: center; }
    .section-head h2 { font-size: clamp(34px, 5vw, 52px); line-height: 1.13; letter-spacing: -.06em; margin: 10px 0 13px; }
    .section-head h2 span { color: var(--blue-light); }
    .section-head p { color: var(--gray); max-width: 650px; font-size: 16px; margin: 0; }
    .section-head.center p { margin: 0 auto; }
    .about-grid { display: grid; grid-template-columns: 1fr .9fr; gap: 72px; align-items: center; }
    .about-text p { margin: 0 0 19px; color: var(--gray); font-size: 17px; }
    .highlights { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 27px; }
    .highlight { display: flex; gap: 10px; align-items: flex-start; color: #d4dce6; font-size: 14px; }
    .check { color: var(--blue-light); font-size: 19px; line-height: 1.25; }
    .stats-card { position: relative; padding: 31px; border-radius: 17px; border: 1px solid #1c2b3b; background: linear-gradient(145deg,#101823,#0a1018); box-shadow: 0 18px 55px #0005; }
    .stats-card::before { content: ""; position: absolute; z-index: -1; inset: -18px; background: linear-gradient(110deg,#174577,#245e87); border-radius: 22px; opacity: .12; filter: blur(25px); }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .stat { border-bottom: 1px solid var(--line); padding-bottom: 17px; }
    .stat:nth-child(n+3) { padding: 12px 0 0; border: 0; }
    .stat-value { display: block; font-size: clamp(35px,4vw,51px); font-weight: 800; letter-spacing: -.07em; color: var(--white); line-height: 1.1; }
    .stat-label { color: var(--gray); font-size: 13px; margin-top: 6px; }
    .timeline { border-left: 1px solid #26374b; margin-left: 7px; padding-left: 30px; }
    .timeline-item { position: relative; padding: 0 0 36px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before { content: ""; position: absolute; top: 6px; left: -36px; width: 11px; height: 11px; border-radius: 50%; background: var(--blue-light); box-shadow: 0 0 0 5px #17457735; }
    .timeline-date { color: var(--blue-light); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .timeline-item h3 { font-size: 21px; margin: 6px 0 2px; }
    .timeline-role { color: #d2dbe6; font-size: 14px; }
    .timeline-item p { max-width: 800px; color: var(--gray); margin: 11px 0 0; }
    .website-grid, .project-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 19px; }
    .website-card { display: grid; grid-template-columns: 100px minmax(0,1fr); align-items: center; gap: 22px; min-height: 185px; padding: 24px; border-radius: 18px; border: 1px solid #202a37; background: linear-gradient(145deg,#111923,#0a1018); transition: transform .25s,border-color .25s,background .25s; }
    .website-card:hover { transform: translateY(-5px); border-color: #285887; background: linear-gradient(145deg,#142233,#0b131d); }
    .website-logo { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 15px; background: #fff; padding: 9px; }
    .website-logo.billionaire-logo { background: #08090b; padding: 5px; }
    .website-logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .website-card > div:last-child { min-width: 0; }
    .website-card h3 { margin: 0 0 7px; font-size: 20px; letter-spacing: -.03em; }
    .website-card p { color: var(--gray); font-size: 14px; margin: 0 0 14px; }
    .website-link { color: var(--blue-light); font-size: 13px; font-weight: 700; }
    .project-card { min-height: 260px; position: relative; overflow: hidden; border: 1px solid #202a37; border-radius: 18px; background: linear-gradient(145deg,#111923,#090e15); padding: 28px; transition: transform .25s,border-color .25s; }
    .project-card:hover { transform: translateY(-4px); border-color: #285887; }
    .project-card::after { content: ""; position: absolute; width: 180px; height: 180px; top: -105px; right: -85px; border-radius: 50%; background: #17457724; filter: blur(4px); }
    .project-index { color: var(--blue-light); font-size: 12px; letter-spacing: .18em; font-weight: 750; }
    .project-card h3 { margin: 19px 0 9px; font-size: 22px; letter-spacing: -.04em; }
    .project-card p { color: var(--gray); font-size: 14px; margin: 0 0 20px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { border: 1px solid #263a52; border-radius: 999px; padding: 4px 10px; color: #c7d6e8; background: #0b1420; font-size: 11px; }
    .skills-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 16px; }
    .skill-card { position: relative; overflow: hidden; padding: 23px; border: 1px solid #202a37; border-radius: 16px; background: #0d141e; transition: border-color .2s,transform .2s; }
    .skill-card:hover { border-color: #285887; transform: translateY(-3px); }
    .skill-card::after { content: ""; position: absolute; top: -50px; right: -50px; width: 120px; height: 120px; border-radius: 50%; background: #17457726; filter: blur(18px); }
    .skill-number { display: inline-grid; place-items: center; width: 42px; height: 42px; margin-bottom: 19px; border-radius: 12px; background: #1745772c; border: 1px solid #24527f; color: var(--blue-light); font-size: 13px; font-weight: 800; }
    .skill-card h3 { margin: 0 0 8px; font-size: 18px; }
    .skill-card p { color: var(--gray); font-size: 13px; margin: 0; }
    .cert-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
    .cert { border: 1px solid var(--line); background: #0b111a; color: #c5cfdb; border-radius: 8px; padding: 9px 12px; font-size: 12px; }
    .contact-panel { position: relative; overflow: hidden; border: 1px solid #202a37; border-radius: 25px; background: linear-gradient(130deg,#101923,#090e15); padding: clamp(28px,6vw,68px); }
    .contact-panel::before,.contact-panel::after { content: ""; pointer-events: none; position: absolute; width: 270px; height: 270px; border-radius: 50%; background: #17457727; filter: blur(65px); }
    .contact-panel::before { top: -150px; right: -100px; }
    .contact-panel::after { bottom: -190px; left: -90px; background: #225a941c; }
    .contact-inner { position: relative; z-index: 1; display: flex; align-items: end; justify-content: space-between; gap: 35px; }
    .contact-inner h2 { font-size: clamp(38px,6vw,65px); line-height: 1.05; letter-spacing: -.07em; margin: 11px 0 17px; }
    .contact-inner h2 span { color: var(--blue-light); }
    .contact-inner p { max-width: 590px; margin: 0; color: var(--gray); font-size: 16px; }
    .contact-actions { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; width: min(100%, 500px); min-width: min(400px,100%); }
    .contact-actions .button { width: 100%; min-width: 0; min-height: 56px; border: 1px solid #285887; border-radius: 14px; text-align: center; }
    .contact-actions .button.outline { border-color: #263a52; background: rgba(5,8,14,.42); }
    .contact-actions .button.outline:hover { border-color: #4c85bc; background: #17457720; }
    .contact-actions .button:focus-visible { outline: 2px solid var(--blue-light); outline-offset: 3px; }
    .footer { display: flex; justify-content: space-between; gap: 20px; color: var(--gray-dark); padding: 23px 2px 0; font-size: 12px; }
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .65s ease,transform .65s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    html[dir="rtl"] .hero::before { right: auto; left: -10%; transform: skewX(12deg); }
    html[dir="rtl"] .portrait-frame { transform: translate(-13px,13px); }
    html[dir="rtl"] .timeline { border-left: 0; margin-left: 0; padding-left: 0; border-right: 1px solid #26374b; margin-right: 7px; padding-right: 30px; }
    html[dir="rtl"] .timeline-item::before { right: -36px; left: auto; }
    @media (max-width:900px) {
      .nav-links { gap: 16px; }
      .nav-links a { font-size: 11px; }
      .hero-grid { gap: 40px; }
      .about-grid { gap: 40px; }
      .skills-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:700px) {
      html { scroll-padding-top: 68px; }
      .container { width: min(100% - 34px, 560px); }
      .nav { gap: 10px; }
      .topbar,.topbar.scrolled { padding: 13px 0; background: rgba(5,8,14,.94); border-color: var(--line); backdrop-filter: blur(14px); }
      .menu-toggle { display: inline-flex; }
      .nav-resume { margin-left: auto; padding: 7px 10px; font-size: 11px; }
      .language-toggle { min-width: 58px; height: 33px; padding: 0 9px; font-size: 11px; }
      .nav-links { display: none; position: absolute; top: 60px; left: 0; right: 0; padding: 17px 24px 22px; background: #080d14; border-bottom: 1px solid var(--line); flex-direction: column; align-items: stretch; gap: 0; }
      .nav-links.open { display: flex; }
      .nav-links a { padding: 12px 0; border-bottom: 1px solid #17212e; }
      .hero { min-height: auto; padding: 112px 0 82px; }
      .hero::before { width: 120%; right: -45%; opacity: .65; }
      .hero-grid { grid-template-columns: 1fr; gap: 30px; padding-top: 0; }
      .hero-copy { text-align: center; margin: auto; }
      .hero h1 { font-size: clamp(54px,15vw,82px); }
      .hero-description { font-size: 17px; margin: 0 auto; }
      .hero-actions,.hero-socials { justify-content: center; }
      .hero-mobile-portrait { display: block; width: 112px; height: 136px; margin: 0 auto 23px; object-fit: cover; object-position: center 34%; border-radius: 15px; border: 1px solid #285887; }
      .portrait-wrap { display: none; }
      .scroll-cue { display: none; }
      .section { padding: 77px 0; }
      .section-head { margin-bottom: 32px; }
      .about-grid { grid-template-columns: 1fr; gap: 34px; }
      .about-text p { font-size: 16px; }
      .highlights { grid-template-columns: 1fr; }
      .website-grid,.project-grid { grid-template-columns: 1fr; }
      .skills-grid { grid-template-columns: 1fr; }
      .contact-inner { align-items: flex-start; flex-direction: column; }
      .contact-actions { width: 100%; min-width: 0; }
      .footer { flex-direction: column; gap: 4px; }
    }
    @media (max-width:430px) {
      .container { width: min(100% - 26px, 560px); }
      .hero-actions { flex-direction: column; align-items: stretch; }
      .button { width: 100%; }
      .nav-resume { padding: 7px 11px; font-size: 11px; }
      .website-card { grid-template-columns: 76px 1fr; gap: 15px; padding: 16px; }
      .website-logo { width: 74px; height: 74px; }
      .website-card h3 { font-size: 17px; }
      .stats-card { padding: 22px; }
      .stat-value { font-size: 35px; }
    }
    @media (max-width:600px) {
      .contact-actions { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *,*::before,*::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .hero-copy,.portrait-wrap,.scroll-cue { animation: none !important; opacity: 1; translate: none; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="app-root"></div>
  <div id="admin-root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
